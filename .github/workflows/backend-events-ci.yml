name: backend-events CI

on:
  push:
    branches: [main]
    paths:
      - 'backend-events/**'
      - '.github/workflows/backend-events-ci.yml'
  pull_request:
    paths:
      - 'backend-events/**'
      - '.github/workflows/backend-events-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-events
    strategy:
      matrix:
        node-version: ['22.13', '24.20.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend-events/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
