name: Update events sitemap

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest published-event sitemap from the API
        run: |
          curl -fsS https://valor-events-api-odp2.onrender.com/sitemap-events.xml -o sitemap-events.xml.new
          if [ ! -s sitemap-events.xml.new ]; then
            echo "Fetched sitemap was empty; keeping the existing file." >&2
            rm -f sitemap-events.xml.new
            exit 0
          fi
          mv sitemap-events.xml.new sitemap-events.xml

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- sitemap-events.xml; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap-events.xml
          git commit -m "Refresh events sitemap"
          git push
