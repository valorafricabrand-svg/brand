    <circle cx="1285" cy="302" r="268" stroke-width="1"/>
  </g>
  <rect x="84" y="72" width="48" height="48" rx="15" fill="#087f5b"/>
  <text x="108" y="105" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="800" text-anchor="middle">V</text>
  <text x="150" y="94" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="800">VALOR AFRICA</text>
  <text x="150" y="114" fill="#89e0bc" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">EVENTS &amp; TICKETS</text>
