    <text x="26" y="297" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">VIP access</text>
    <text x="244" y="297" fill="#fff" font-family="Arial,sans-serif" font-size="14" text-anchor="end">Your way</text>
