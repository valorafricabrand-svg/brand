<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071d1a"/>
      <stop offset=".58" stop-color="#0a5945"/>
      <stop offset="1" stop-color="#10233a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#51dca7" stop-opacity=".38"/>
      <stop offset="1" stop-color="#51dca7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffe5a0"/>
      <stop offset="1" stop-color="#ffd447"/>
