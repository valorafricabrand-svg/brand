    <text x="39" y="58" fill="#d9f7e8" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2">YOUR EVENT</text>
    <text x="39" y="101" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="800">MADE TO</text>
    <text x="39" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="800">STAND OUT</text>
