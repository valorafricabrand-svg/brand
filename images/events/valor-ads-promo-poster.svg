  <text x="78" y="392" fill="#fff" font-family="Arial,sans-serif" font-size="67" font-weight="800" letter-spacing="-2">into a <tspan fill="url(#gold)">full house.</tspan></text>
  <text x="84" y="449" fill="#d7e8e2" font-family="Arial,sans-serif" font-size="21">Create your listing. Set your tickets. Get discovered.</text>
